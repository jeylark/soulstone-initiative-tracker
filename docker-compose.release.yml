
services:
  app:
    image: soulstone-initiative-tracker-app:0.1.0-0
    pull_policy: never
    restart: unless-stopped

    environment:
      HOST: 0.0.0.0
      PORT: 3000

    ports:
      - '127.0.0.1:8080:3000'

    volumes:
      - ./data/config:/app/config:ro
      - ./data/logs:/app/logs

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
